<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish</title>
    <link rel="stylesheet" href="login.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    padding: 20px;
}

.login-box {
    background: white;
    max-width: 400px;
    margin: 0 auto;
    padding: 40px 35px;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    animation: slideIn 0.5s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.login-box h2 {
    text-align: center;
    color: #333;
    margin-bottom: 28px;
    font-size: 28px;
    font-weight: 700;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #555;
    font-size: 14px;
}

.password-group {
    margin-bottom: 18px;
}

.password-wrapper {
    position: relative;
    width: 100%;
}

.password-wrapper input {
    width: 100%;
    padding: 12px 45px 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    transition: 0.3s;
    outline: none;
}

.password-wrapper input:focus {
    border-color: #f5576c;
    box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.15);
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    transition: 0.2s;
    opacity: 0.6;
}

.toggle-password:hover {
    opacity: 1;
    transform: translateY(-50%) scale(1.1);
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    font-size: 14px;
}

.remember {
    color: #555;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}

.remember input {
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.forgot {
    color: #f5576c;
    text-decoration: none;
    font-weight: 600;
}

.forgot:hover {
    text-decoration: underline;
}

.btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(245, 87, 108, 0.45);
}

.btn-login:active {
    transform: scale(0.97);
}

.register-link {
    text-align: center;
    margin-top: 22px;
    color: #777;
    font-size: 14px;
}

.register-link a {
    color: #f5576c;
    text-decoration: none;
    font-weight: 600;
}

.register-link a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h2>🔐 Kirish</h2>
            <form action="/en/login/" method="POST">
                {%csrf_token%}
                <div class="input-group">
                     <input type="text" name="username" placeholder="Userni kiriting " required>
                    <label for="email">Email</label>
           <input type="email" id="email" name="email" placeholder="Email manzilingiz" required>
                </div>
                <div class="input-group password-group">
                    <label for="password">Parol</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" placeholder="Parolingiz" required>
                        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                    </div>
                </div>
                <div class="options">
                    <label class="remember">
                        <input type="checkbox"> Eslab qol
                    </label>
                    <a href="#" class="forgot">Parolni unutdingizmi?</a>
                </div>
                <button type="submit" class="btn-login">Kirish</button>
            </form>
            <p class="register-link">Hisobingiz yo'qmi? <a href="/regiter.html/">Ro'yxatdan o'tish</a></p>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggle = input.nextElementSibling;

            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
            } else {
                input.type = 'password';
                toggle.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
