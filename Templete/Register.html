<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="register.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    padding: 20px;
}

.register-box {
    background: white;
    max-width: 420px;
    margin: 0 auto;
    padding: 40px 35px;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.register-box h2 {
    text-align: center;
    color: #333;
    margin-bottom: 28px;
    font-size: 28px;
    font-weight: 700;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #555;
    font-size: 14px;
}

.password-group {
    margin-bottom: 18px;
}

.password-wrapper {
    position: relative;
    width: 100%;
}

.password-wrapper input {
    width: 100%;
    padding: 12px 45px 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    transition: 0.3s;
    outline: none;
}

.password-wrapper input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    transition: 0.2s;
    opacity: 0.6;
}

.toggle-password:hover {
    opacity: 1;
    transform: translateY(-50%) scale(1.1);
}

.btn-register {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 8px;
}

.btn-register:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.45);
}

.btn-register:active {
    transform: scale(0.97);
}

.login-link {
    text-align: center;
    margin-top: 22px;
    color: #777;
    font-size: 14px;
}

.login-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
}

.login-link a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="register-box">
            <h2>📝 Ro'yxatdan o'tish</h2>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="fullname">To'liq ism</label>
                    <input type="text" id="fullname" placeholder="Ism familiyangizni kiriting" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email manzilingiz" required>
                </div>
                <div class="input-group password-group">
                    <label for="password">Parol</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Parolingiz" required>
                        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                    </div>
                </div>
                <div class="input-group password-group">
                    <label for="confirm-password">Parolni tasdiqlash</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="Parolni qayta kiriting" required>
                        <span class="toggle-password" onclick="togglePassword('confirm-password')">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn-register">Ro'yxatdan o'tish</button>
            </form>
            <p class="login-link">Akkauntingiz bormi? <a href="login.html">Kirish</a></p>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggle = input.nextElementSibling;

            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
            } else {
                input.type = 'password';
                toggle.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
