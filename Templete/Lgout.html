<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiqish</title>
    <link rel="stylesheet" href="logout.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    padding: 20px;
}

.logout-box {
    background: white;
    max-width: 420px;
    margin: 0 auto;
    padding: 45px 35px;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    text-align: center;
    animation: popIn 0.5s ease;
}

@keyframes popIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.icon {
    font-size: 60px;
    margin-bottom: 10px;
    display: block;
}

.logout-box h2 {
    color: #333;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
}

.message {
    color: #666;
    font-size: 16px;
    margin-bottom: 30px;
    line-height: 1.6;
}

.button-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-logout {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    padding: 13px 40px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
}

.btn-logout:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(245, 87, 108, 0.45);
}

.btn-cancel {
    background: #f0f0f0;
    color: #555;
    padding: 13px 40px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
}

.btn-cancel:hover {
    background: #e0e0e0;
    transform: translateY(-3px);
}

.back-link {
    margin-top: 25px;
    color: #888;
    font-size: 14px;
}

.back-link a {
    color: #4facfe;
    text-decoration: none;
    font-weight: 600;
}

.back-link a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
<form>
    {%csrf_token%}
    <div class="container">
        <div class="logout-box">
            <div class="icon">👋</div>
            <h2>Chiqish</h2>
            <p class="message">Haqiqatan ham hisobingizdan chiqmoqchimisiz?</p>
            <div class="button-group">
                <a href="login.html" class="btn-logout">Ha, chiqish</a>
                <a href="#" class="btn-cancel">Bekor qilish</a>
            </div>
            <p class="back-link">🔙 <a href="login.html">Kirish sahifasiga qaytish</a></p>
        </div>
    </div>
    </form>
</body>
</html>
